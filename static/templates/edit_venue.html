{% extends 'base.html' %}

{% block content %}
<section class="page-header-card">
    <a href="/competitions/{{competition.id}}/venues/{{venue.id}}/manager" class="text-link">← Back to venue management</a>
    <span class="eyebrow">Edit Venue</span>
    <h1>{{venue}}</h1>
    <p class="lead">Update location details, competitor limit, etc.</p>
</section>

<section class="surface-card form-card">
    <form method="post" action="/competitions/{{competition.id}}/venues/{{venue.id}}/edit">
        <label for="country">Country</label>
        <input type="text" id="country" name="country" value="{{venue.country}}">

        <label for="city">City, state or region</label>
        <input type="text" id="city" name="city" value="{{venue.city}}">

        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="{{venue.address}}">

        <label for="limit">Competitor limit</label>
        <input type="number" id="limit" name="limit" value="{{venue.competitor_limit}}">

        <label for="timezone">Timezone offset</label>
        <input type="text" id="timezone" name="timezone" value="{{venue.timezone}}">

        <label for="reg_fee">Registration fee and details</label>
        <textarea id="reg_fee" name="reg_fee">{{venue.registration_fee_text}}</textarea>
        <p class="form_info">Use \n to create multiple lines in the venue details.</p>

        <label class="checkbox-row" for="auto_accept">
            <input type="checkbox" id="auto_accept" name="auto_accept" {{"checked" if venue.accept_registrations_automatically else ''}}>
            <span>Accept registrations automatically when capacity is available</span>
        </label>

        <div class="action-row">
            <button type="submit" class="button button-primary">Update venue</button>
        </div>
    </form>
</section>

{% endblock %}
